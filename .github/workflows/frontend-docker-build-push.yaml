name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
env:
  PROJECT_ID: georgef-sandbox
  REGION: us-central1
  REPO: groceries
  IMAGE_NAME: frontend
  IMAGE_URI: us-central1-docker.pkg.dev/georgef-sandbox/groceries/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ env.IMAGE_URI }} ./frontend
          docker push ${{ env.IMAGE_URI }}

  deploy-to-gke:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      NAMESPACE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - name: Checkout only manifests
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            frontend/k8s
          sparse-checkout-cone-mode: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Authenticate to GKE
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: ${{ secrets.GKE_CLUSTER_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Substitute namespace and apply manifests
        run: |
          for f in frontend/k8s/*.yaml; do
            envsubst < $f | kubectl apply -f -
          done
          kubectl rollout restart deployment groceries-frontend -n $NAMESPACE
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
